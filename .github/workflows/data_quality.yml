name: Data Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 每30分钟跑一次
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://anonymous99-rise.github.io/honeypot-blocklist/

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: pip install feedgenerator requests urllib3

    - name: Fetch latest IP feed from HFish
      env:
        HFISH_HOST: ${{ secrets.HFISH_HOST }}
        HFISH_API_KEY: ${{ secrets.HFISH_API_KEY }}
        OUTPUT_TXT: ip_list.txt
      run: python tools/generate_feed.py

    - name: Run Validation Script
      run: python tests/validate_feed.py

    - name: Lint Python Tools
      run: pip install flake8 && flake8 tools --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Generate RSS Feed
      run: |
        python - <<'EOF'
        import datetime, io
        import feedgenerator
        from pathlib import Path

        # Read IP count from ip_list.txt
        ip_file = Path("ip_list.txt")
        lines = [l.strip() for l in ip_file.read_text().splitlines() if l.strip() and not l.startswith("#")]
        ip_count = len(lines)

        # Parse last update time from first comment line
        first_line = ip_file.read_text().splitlines()[0] if ip_file.read_text() else ""
        last_update = datetime.datetime.now(datetime.timezone.utc)
        try:
            for line in ip_file.read_text().splitlines()[:2]:
                if "Updated:" in line:
                    last_update = datetime.datetime.strptime(line.split("Updated:")[1].strip(), "%Y-%m-%d %H:%M:%S.%f")
                    last_update = last_update.replace(tzinfo=datetime.timezone.utc)
                    break
        except:
            pass

        feed = feedgenerator.Rss201rev2Feed(
            title="HFish Honeypot Threat Feed",
            link="https://anonymous99-rise.github.io/honeypot-blocklist/",
            description="High-fidelity malicious IP feed generated from HFish honeypot telemetry. Updated every 2-4 hours.",
            language="en",
            managing_editor="anonymous99-r@proton.me",
            web_master="anonymous99-r@proton.me",
            ttl=180,
        )

        feed.add_item(
            title=f"Feed Updated - {last_update.strftime('%Y-%m-%d %H:%M:%S')}",
            link="https://anonymous99-rise.github.io/honeypot-blocklist/ip_list.txt",
            guid="https://anonymous99-rise.github.io/honeypot-blocklist/ip_list.txt",
            description=f"New threat feed published. {ip_count} IPs in blocklist. Time window: last 24 hours.",
            pubdate=last_update,
        )

        buf = io.StringIO()
        feed.write(buf, encoding="utf-8")
        Path("rss.xml").write_text(buf.getvalue(), encoding="utf-8")
        print(f"Generated rss.xml with {ip_count} IPs")
        EOF

    - name: Update HTML
      run: |
        python - <<'EOF'
        from pathlib import Path

        ip_file = Path("ip_list.txt")
        lines = [l.strip() for l in ip_file.read_text().splitlines() if l.strip() and not l.startswith("#")]
        ip_count = len(lines)

        html = Path("index.html").read_text(encoding="utf-8")
        # Update the static IP count placeholder
        html = html.replace('<span class="stat-value" id="ip-count">--</span>', f'<span class="stat-value" id="ip-count">{ip_count}</span>')
        Path("index.html").write_text(html, encoding="utf-8")
        print(f"Updated index.html with {ip_count} IPs")
        EOF

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add rss.xml index.html ip_list.txt
        git commit -m "ci: auto-update RSS feed and HTML [skip ci]" || {
          echo "Nothing to commit; skipping push."
          exit 0
        }

        for attempt in 1 2 3; do
          git pull --rebase origin "${GITHUB_REF_NAME}" && break
          echo "Pull failed on attempt ${attempt}; retrying..."
          sleep 2
        done

        git push && exit 0
        echo "Push failed after 3 attempts."
        exit 1
          echo "Push failed on attempt ${attempt}; retrying..."
          sleep 2
        done

        echo "Failed to push after 3 attempts."
        exit 1
