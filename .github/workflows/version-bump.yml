name: Version Bump

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: get_version
        shell: bash
        run: |
          current_version=$(grep -oP '__version__ = "[^"]+' tools/generate_feed.py | cut -d'"' -f2)
          echo "Current version: $current_version"
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          current_version=${{ steps.get_version.outputs.current_version }}
          if [[ $current_version =~ ^V([0-9]+)\.([0-9]+)\.([0-9]+)([a-z]?)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            suffix=${BASH_REMATCH[4]}
            new_patch=$((patch + 1))
            new_version="V$major.$minor.$new_patch$suffix"
          else
            new_version="V1.0.1"
          fi
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update version in files
        shell: bash
        run: |
          new_version=${{ steps.bump_version.outputs.new_version }}
          sed -i "s/__version__ = .*/__version__ = \"$new_version\"/" tools/generate_feed.py

      - name: Check if tag exists
        id: check_tag
        shell: bash
        run: |
          if git rev-parse --verify "${{ steps.bump_version.outputs.new_version }}" 2>/dev/null; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push without tagging
        if: steps.check_tag.outputs.tag_exists == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump version to ${{ steps.bump_version.outputs.new_version }}"
          push_options: --force-with-lease

      - name: Commit and push with tagging
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump version to ${{ steps.bump_version.outputs.new_version }}"
          tagging_message: "${{ steps.bump_version.outputs.new_version }}"
          push_options: --force-with-lease

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_version }}
          name: ${{ steps.bump_version.outputs.new_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
